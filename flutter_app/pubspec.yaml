name: uts_academico
description: UTS Académico docente
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  socket_io_client: ^2.0.3+1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

  # Inter (DESIGN.md §5). Se empaqueta en vez de descargarse en caliente: la app
  # se usa con la red del campus y una fuente que llega tarde provoca un salto
  # de texto en el primer arranque. Solo los cuatro pesos que la interfaz usa.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
