name: uts_academico
description: UTS Académico docente
publish_to: "none"
version: 2.8.0+21

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.2
  socket_io_client: ^2.0.3+1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  image_picker: ^1.2.3
  # Recordatorios de clase en el teléfono. Se programan como alarmas del
  # sistema, así que llegan con la aplicación cerrada y sin conexión — que es
  # justo la situación de un salón con el wifi del campus caído.
  flutter_local_notifications: ^18.0.1
  # Requerida por `zonedSchedule`. Se programa sobre instantes absolutos con la
  # zona fijada a UTC: la hora de la clase ya viene resuelta del servidor.
  timezone: ^0.9.4
  # Push del servidor con la app cerrada (riesgo académico, cambios de horario
  # hechos desde el escritorio). Es OPCIONAL en tiempo de compilación: sin
  # `android/app/google-services.json` el plugin de Gradle no se aplica,
  # `Firebase.initializeApp()` falla, `PushService` lo captura y la app sigue
  # funcionando sin push. Los recordatorios de clase no dependen de esto.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Tokens en Android Keystore / almacén seguro de cada plataforma. Las
  # preferencias normales quedan solo para caché y opciones no sensibles.
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/rubri/

  # Inter (DESIGN.md §5). Se empaqueta en vez de descargarse en caliente: la app
  # se usa con la red del campus y una fuente que llega tarde provoca un salto
  # de texto en el primer arranque. Solo los cuatro pesos que la interfaz usa.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
