# Verificación en cada cambio: tipos y pruebas de las tres partes.
#
# Existe por un fallo concreto. Las pruebas de Flutter solo corrían dentro de
# `release.yml`, y ese workflow publica el escritorio ANTES de tocar el móvil:
# un error de Dart se descubría con el `.exe` ya publicado y el archivo de
# Dropbox del botón de Windows ya sobrescrito, dejando la página repartiendo
# 2.4.0 en Windows y la anterior en Android hasta re-etiquetar.
#
# Aquí no se compila nada ni se publica nada. Solo se comprueba que el árbol
# está sano, que es lo que hay que saber ANTES de crear la etiqueta.

name: Verificar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push encima de otro cancela la comprobación anterior: interesa el estado
# del último commit, no el histórico de una rama en movimiento.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Coherencia de versiones y plataformas ──────────────────────────────
  #
  # Va aquí y no solo en `release.yml` por lo mismo que las pruebas de Flutter:
  # descubrir un descuadre durante una publicación es descubrirlo tarde. Una
  # release mal numerada no se corrige, se reemplaza.
  #
  # La autoprueba del manifiesto cubre un fallo que no se ve en ninguna parte:
  # si una extensión deja de casar con su clave, `latest.json` sale sin esa
  # plataforma y el actualizador de quien la tenga instalada responde «ya tienes
  # la última versión» para siempre.
  plataformas:
    name: Versiones y plataformas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Matriz de plataformas
        run: node .github/scripts/plataformas.mjs

      - name: Coherencia de la versión
        run: node .github/scripts/comprobar-version.mjs

      - name: Autoprueba del manifiesto del actualizador
        run: node .github/scripts/componer-manifiesto.mjs --autoprueba

      # Si la lista de exclusión de la AppImage se vacía en una edición
      # descuidada, el saneado deja de hacer nada y la AppImage vuelve a abrir
      # con la ventana en blanco — sin ningún error en la publicación.
      - name: Autoprueba del saneado de la AppImage
        run: node desktop/scripts/sanear-appimage.mjs --autoprueba

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, no 20: los lock files de este repositorio los mantiene npm 11, y
          # npm 10 resuelve distinto los peer opcionales (`yaml` de vite), asi
          # que `npm ci` fallaba con 'Missing: yaml@2.9.0 from lock file' sobre
          # un arbol que en local instala limpio.
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar
        working-directory: backend
        run: npm ci

      - name: Tipos
        working-directory: backend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Pruebas del dominio
        working-directory: backend
        run: npm test

  escritorio:
    name: Escritorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, no 20: los lock files de este repositorio los mantiene npm 11, y
          # npm 10 resuelve distinto los peer opcionales (`yaml` de vite), asi
          # que `npm ci` fallaba con 'Missing: yaml@2.9.0 from lock file' sobre
          # un arbol que en local instala limpio.
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar
        working-directory: desktop
        run: npm ci

      - name: Tipos
        working-directory: desktop
        run: npm run typecheck

      - name: Pruebas
        working-directory: desktop
        run: npm test

  movil:
    name: Móvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Mismos comandos que la puerta de `release.yml`, para que lo que pase
      # aquí pase allí. No se compila el APK: eso necesita el keystore y tarda
      # varios minutos, y lo que se busca aquí es el error de código.
      - name: Dependencias
        working-directory: flutter_app
        run: flutter pub get

      - name: Análisis
        working-directory: flutter_app
        run: flutter analyze

      - name: Pruebas
        working-directory: flutter_app
        run: flutter test
