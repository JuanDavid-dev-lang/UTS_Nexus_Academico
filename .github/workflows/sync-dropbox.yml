name: Sincronizar Dropbox

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release que se copiará a /Uts
        required: true
        default: v2.6.1

permissions:
  contents: read

jobs:
  sync:
    name: Dropbox /Uts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar instaladores publicados
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artefactos
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern '*-setup.exe' --pattern '*.apk' --dir artefactos

      - name: Subir Windows a Dropbox
        id: windows
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          archivo=$(find artefactos -name '*-setup.exe' -print -quit)
          bash .github/scripts/subir-a-dropbox.sh \
            "$archivo" '/Uts/UTS-Nexus-Academico-Windows.exe'

      - name: Subir Android a Dropbox
        id: android
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          archivo=$(find artefactos -name '*.apk' -print -quit)
          bash .github/scripts/subir-a-dropbox.sh \
            "$archivo" '/Uts/UTS-Nexus-Academico-Android.apk'

      - name: Mostrar enlaces para la página
        run: |
          echo "WINDOWS=${{ steps.windows.outputs.url }}"
          echo "ANDROID=${{ steps.android.outputs.url }}"
