# Publica una release de la que los tres clientes se actualizan solos.
#
# El trabajo de Windows va primero porque `tauri-action` es lo que CREA la
# release en el repositorio de instaladores. Linux y Android se cuelgan de ella:
# adjuntan sus paquetes a la misma publicación, que es donde los busca cada
# cliente.
#
# El manifiesto `latest.json` **no** lo hace `tauri-action`, y esto es lo menos
# obvio de este archivo. Con una sola plataforma funcionaba; con dos deja de
# funcionar, porque `tauri-action` no fusiona un manifiesto existente: borra el
# asset y sube el suyo, armado solo con lo que compiló ese trabajo. El segundo
# en terminar dejaría al primero sin actualizaciones, y ese fallo no se ve en
# ninguna parte —la release está completa, los instaladores están ahí— hasta que
# alguien pulsa «Buscar actualizaciones» y le contestan que ya tiene la última.
#
# Por eso el manifiesto tiene un dueño: el trabajo `manifiesto`, el último de la
# cadena, que lo compone a partir de los assets ya publicados y falla si falta
# alguno.
#
#   desktop (Windows) ──┬── linux ────┐
#                       └── android ──┴── manifiesto ── espejo ── dropbox
#
# The release does NOT live in this repository. This one is private; the one
# named below is public and holds nothing but the installers. An updater has to
# reach its manifest without credentials, and a token shipped inside a `.exe` or
# an `.apk` is not a secret — anyone who installs the app can read it out of the
# binary. Splitting them is what lets the source stay private while the
# installers stay downloadable, which is what an installer is for.
#
# Required repository secrets:
#   RELEASES_TOKEN                      write access to the releases repository
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key (updater signature)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if generated without one)
#   ANDROID_KEYSTORE_BASE64             upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD           store password
#   ANDROID_KEY_ALIAS                   key alias
#   ANDROID_KEY_PASSWORD                key password
#   DROPBOX_APP_KEY                     app de Dropbox (developers.dropbox.com)
#   DROPBOX_APP_SECRET                  su secreto
#   DROPBOX_REFRESH_TOKEN               token de refresco de la cuenta dueña
#
# Los dos instaladores se suben además a Dropbox, encima de los archivos a los
# que apuntan los botones de la página de descargas. La página no consulta el
# release: si esa subida falla, la página sigue repartiendo la versión anterior.
#
# Antes de etiquetar, sube la versión con el script — no a mano:
#   node .github/scripts/subir-version.mjs patch
#
# Qué archivos toca y qué plataformas existen sale de `.github/scripts/plataformas.mjs`,
# que es el registro único. Añadir macOS o iOS se hace ahí y aquí, en ningún otro sitio.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Repositorio público de instaladores. Los clientes consultan su `latest.json`
  # y sus assets; nunca este. Si cambia, hay que cambiarlo también en
  # `desktop/src-tauri/tauri.conf.json` y en
  # `flutter_app/lib/core/services/update_service.dart`.
  REPO_RELEASES_OWNER: JuanDavid-dev-lang
  REPO_RELEASES_NAME: UTS_Nexus_Releases

  # Los mismos dos enlaces que llevan escritos los botones de la página de
  # descargas. Cada trabajo escribe su instalador ENCIMA del archivo al que
  # apunta el suyo, así que la página reparte la versión nueva sin tocar una
  # línea de HTML. Si alguna vez cambian, hay que cambiarlos también en
  # `index.html` del repositorio `utsnexus.github.io`: son enlaces públicos, no
  # secretos, y por eso están a la vista.
  # Sin el parámetro `st=` que copia Dropbox al compartir: es un testigo temporal
  # y caduca. `rlkey` es el que da acceso y no caduca.
  # La app de Dropbox usa acceso "App folder". Estas rutas raíz se guardan
  # físicamente dentro de Dropbox/Apps/UTSNEXUS/.
  DROPBOX_RUTA_WINDOWS: '/UTS-Nexus-Academico-Windows.exe'
  DROPBOX_RUTA_ANDROID: '/UTS-Nexus-Academico-Android.apk'
  # La AppImage y no el .deb ni el .rpm: es el único de los tres que corre en
  # cualquier distribución, y un botón de una página de descargas no puede
  # preguntar cuál usa quien lo pulsa. Quien quiera el paquete nativo lo tiene
  # en la publicación de GitHub, que es donde se elige con conocimiento.
  DROPBOX_RUTA_LINUX: '/UTS-Nexus-Academico-Linux.AppImage'

jobs:
  desktop:
    name: Escritorio (Windows)
    runs-on: windows-latest
    # El cuerpo de la etiqueta y el nombre de la release los necesitan los
    # trabajos de más abajo. Se leen una vez, aquí, y viajan como salidas: dos
    # trabajos leyendo la misma anotación de git pueden discrepar si uno hace
    # checkout superficial, y entonces la release y su espejo salen con textos
    # distintos.
    outputs:
      cuerpo: ${{ steps.etiqueta.outputs.cuerpo }}
      nombre: ${{ steps.version.outputs.nombre }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Historia completa: el cuerpo de la release sale de la anotación de la
      # etiqueta, y con un checkout superficial esa anotación no se descarga.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # En el repositorio de instaladores la etiqueta la crea la API y nace sin
      # mensaje, así que hay que llevárselo desde aquí. Sin esto la release sale
      # con el cuerpo vacío y no cuenta nada de lo que trae.
      - name: Leer el mensaje de la etiqueta
        id: etiqueta
        shell: bash
        run: |
          set -euo pipefail
          # `actions/checkout` deja la etiqueta como LIGERA aunque en el remoto
          # sea anotada: al hacer checkout de `refs/tags/vX` crea una etiqueta
          # local que apunta al commit y pisa la anotación. `%(contents)` sobre
          # ella devuelve entonces el mensaje del COMMIT, así que la release
          # v2.7.0 salió con el changelog de desarrollo en vez de con las notas
          # escritas para quien instala. Volver a traerlas lo corrige.
          git fetch --force --tags origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"

          # Se comprueba que sea anotada ANTES de leerla. `%(contents)` sobre
          # una etiqueta ligera devuelve el mensaje del commit, así que sin
          # esta comprobación un fallo del `fetch` de arriba volvería a colar
          # el changelog de desarrollo como notas de la publicación, y nadie
          # se enteraría hasta abrir la página.
          tipo=$(git cat-file -t "${{ github.ref_name }}" 2>/dev/null || echo desconocido)
          if [ "$tipo" != "tag" ]; then
            echo "::warning::${{ github.ref_name }} no es una etiqueta anotada ($tipo): la release saldrá sin notas propias."
            cuerpo=''
          else
            cuerpo=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          fi
          {
            echo 'cuerpo<<FIN_DEL_MENSAJE'
            echo "$cuerpo"
            echo 'FIN_DEL_MENSAJE'
          } >> "$GITHUB_OUTPUT"

      # ── El token, antes de compilar ────────────────────────────────────
      #
      # `tauri-action` no descubre que el token no sirve hasta que va a crear la
      # release, y para entonces el `.exe` ya está compilado. La primera
      # publicación de la 1.2.0 murió exactamente ahí —«Bad credentials»— tras
      # seis minutos de compilación, con todo lo demás correcto.
      #
      # Un token caduca sin avisar a nadie y sin que cambie una línea del
      # repositorio, así que no basta con que funcionara la vez anterior.
      # Comprobarlo cuesta una llamada y ahorra la compilación entera.
      - name: Comprobar el acceso al repositorio de publicaciones
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -uo pipefail
          destino='${{ env.REPO_RELEASES_OWNER }}/${{ env.REPO_RELEASES_NAME }}'

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta el secreto RELEASES_TOKEN. Sin él no se puede publicar en $destino."
            exit 1
          fi

          # Se pregunta por el permiso de escritura, no solo por que el token
          # abra: uno de solo lectura pasaría la primera comprobación y fallaría
          # igual de tarde, que es justo lo que esto viene a evitar.
          permiso=$(gh api "repos/$destino" --jq '.permissions.push // false' 2>/dev/null || echo 'sin-acceso')

          case "$permiso" in
            true)  echo "RELEASES_TOKEN puede escribir en $destino." ;;
            false) echo "::error::RELEASES_TOKEN llega a $destino pero no puede escribir. Necesita permiso de contenidos con escritura."; exit 1 ;;
            *)     echo "::error::RELEASES_TOKEN no sirve para $destino: caducado, revocado o sin acceso. Renuévalo en Settings → Secrets and variables → Actions."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Antes de gastar quince minutos compilando: que los cinco archivos de
      # versión digan lo mismo y que coincidan con la etiqueta empujada. Una
      # release mal numerada no se corrige, solo se reemplaza.
      - name: Comprobar la versión
        id: version
        shell: bash
        run: node .github/scripts/comprobar-version.mjs "${{ github.ref_name }}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Instalar dependencias
        working-directory: desktop
        run: npm ci

      - name: Verificar antes de publicar
        working-directory: desktop
        run: |
          npm run typecheck
          npm test

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          # El token del propio repositorio no sirve: la release se crea en otro.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          owner: ${{ env.REPO_RELEASES_OWNER }}
          repo: ${{ env.REPO_RELEASES_NAME }}
          tagName: ${{ github.ref_name }}
          # La etapa va en el nombre a propósito: quien abre la página de
          # publicaciones tiene que saber que instala algo en construcción sin
          # tener que deducirlo del número. **Sale de `version.ts`**, no de una
          # cadena escrita aquí: mientras estuvo escrita a mano, cambiar de
          # etapa eran tres sitios que tenían que acordarse el uno del otro, y
          # el que se olvidaba publicaba una release con la etapa anterior.
          # En la etapa estable la etiqueta queda vacía y solo se ve el número.
          releaseName: UTS Nexus Académico ${{ steps.version.outputs.nombre }}
          releaseBody: ${{ steps.etiqueta.outputs.cuerpo }}
          # El commit de este repositorio no existe en el de instaladores, así
          # que la etiqueta tiene que nacer de su rama principal.
          releaseCommitish: main
          releaseDraft: false
          prerelease: false
          # El manifiesto NO lo genera aquí. Lo compone el trabajo `manifiesto`
          # a partir de los assets de todas las plataformas: `tauri-action` no
          # fusiona un `latest.json` existente, así que dejarlo activado en dos
          # trabajos hace que el segundo borre las claves del primero. Está
          # explicado entero en la cabecera de este archivo.
          includeUpdaterJson: false

      # Los paquetes se guardan como artefactos para los dos trabajos que vienen
      # después: el espejo y Dropbox. Antes la subida a Dropbox era un paso de
      # ESTE trabajo, y eso costó un release entero: `android` declara
      # `needs: desktop`, así que un fallo al subir a Dropbox —con el `.exe` ya
      # publicado y firmado— dejaba el trabajo en rojo y Android **ni se
      # ejecutaba**. La publicación se quedaba sin APK por un problema que no
      # tenía nada que ver con Android.
      #
      # Van también los `.sig`: el espejo los necesita para que una instalación
      # antigua que mire a este repositorio pueda verificar lo que descarga.
      - name: Guardar los paquetes de Windows
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Escritorio (Linux)
    runs-on: ubuntu-24.04
    needs: desktop
    # ── Por qué un contenedor de 22.04 sobre un runner de 24.04 ─────────────
    #
    # Lo que se compila aquí arranca —o no— en función de la versión de glibc
    # con la que se enlazó, y esa decisión **no se puede deshacer después**: un
    # binario compilado contra glibc 2.39 ni se ejecuta en Debian 12, y el error
    # que da no menciona glibc ni sugiere nada. Compilando contra la 2.35 de
    # Ubuntu 22.04 corre en Debian 12 y 13, Ubuntu 22.04+, Mint 21+, Fedora 36+,
    # RHEL y Rocky 9, openSUSE Leap 15.5+ y Arch. Hacia atrás no hay nada que
    # perder; hacia adelante, todo.
    #
    # Y va en contenedor en vez de en el runner `ubuntu-22.04` porque esa imagen
    # empieza a retirarse el 17 de septiembre de 2026, con fallos programados
    # antes de desaparecer del todo. Un contenedor lo fija nosotros y no GitHub.
    container: ubuntu:22.04
    # Dentro de un contenedor, GitHub ejecuta cada `run` con `sh -e`, no con
    # bash: la imagen base podría no traer bash, así que no lo da por hecho.
    # `ubuntu:22.04` sí lo trae, y sin declararlo el primer `set -euo pipefail`
    # muere con «Illegal option -o pipefail» —dash no conoce `pipefail`— antes
    # incluso del checkout. El resto de los trabajos corren en el runner, donde
    # bash ya es el predeterminado; este es el único que necesita decirlo.
    defaults:
      run:
        shell: bash
    steps:
      # `actions/checkout` necesita git, y la imagen base de Ubuntu no lo trae.
      # Sin esto el checkout cae a la API y descarga un tarball sin historia,
      # que aquí da igual, pero el resto de dependencias no son opcionales.
      - name: Dependencias de compilación
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl wget file ca-certificates build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev \
            libdbus-1-dev \
            patchelf desktop-file-utils squashfs-tools
          # Dos que no son obvias:
          #   libdbus-1-dev  lo pide `keyring`: en Linux habla con el Secret
          #                  Service por D-Bus. Sin él la compilación falla en
          #                  el build script y el mensaje no nombra a keyring.
          #   squashfs-tools lo pide `sanear-appimage.mjs` para volver a
          #                  empaquetar la AppImage sin las librerías que tienen
          #                  que venir del sistema. Sin él ese paso falla a
          #                  propósito, en vez de publicar una AppImage que abre
          #                  con la ventana en blanco.

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # Clave propia: este trabajo compila para un objetivo distinto que el
          # de Windows y comparten `workspaces`. Sin separarlas, una caché
          # invalida a la otra en cada publicación y las dos compilan de cero.
          key: linux-22.04

      - name: Instalar dependencias
        working-directory: desktop
        run: npm ci

      # `desktop:build`, no `tauri build` a secas: el script encadena el saneado
      # de la AppImage, que es lo que la hace arrancar en un equipo cuyo wayland
      # sea más nuevo que el de esta imagen. Saltárselo produce una AppImage que
      # compila, firma y publica sin un solo error, y abre con la ventana en
      # blanco en la mitad de los equipos.
      - name: Compilar y firmar los tres paquetes
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Las herramientas de `linuxdeploy` que empaquetan la AppImage son
          # ellas mismas AppImages, y dentro de un contenedor no hay FUSE para
          # montarlas. Con esto se extraen y se ejecutan, que es la salida
          # soportada. Sin esto el paso falla con «failed to run linuxdeploy» y
          # nada que indique que el problema es FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run desktop:build

      # ── Firmar lo que el empaquetador no haya firmado ───────────────────
      #
      # El actualizador rechaza cualquier paquete sin firma válida, así que un
      # `.deb` sin `.sig` no es «un paquete al que le falta un archivo»: es un
      # formato que no se puede actualizar. Qué firma el empaquetador por su
      # cuenta ha cambiado entre versiones de Tauri, y este paso es idempotente
      # —solo toca lo que llega sin firmar—, así que da igual en cuál estemos.
      - name: Firmar los paquetes que falten
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          raiz=src-tauri/target/release/bundle
          encontrados=0
          while IFS= read -r paquete; do
            encontrados=$((encontrados + 1))
            if [ -f "$paquete.sig" ]; then
              echo "· ya firmado: $(basename "$paquete")"
            else
              echo "· firmando:   $(basename "$paquete")"
              npm run --silent tauri -- signer sign "$paquete"
            fi
          done < <(find "$raiz" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \))

          # Tres paquetes, ni uno menos. Publicar dos de tres deja sin
          # actualizaciones a la familia de distribuciones que falte, y eso no
          # se nota hasta que alguien pulsa el botón.
          if [ "$encontrados" -ne 3 ]; then
            echo "::error::Se esperaban 3 paquetes (AppImage, deb, rpm) y se encontraron $encontrados."
            exit 1
          fi

      - name: Adjuntar los paquetes a la release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.REPO_RELEASES_OWNER }}/${{ env.REPO_RELEASES_NAME }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/rpm/*.rpm.sig

      - name: Guardar los paquetes de Linux
        uses: actions/upload-artifact@v4
        with:
          name: instalador-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error
          retention-days: 1

  android:
    name: Móvil (Android)
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar el keystore de firma
        working-directory: flutter_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Sin keystore el build cae a la clave de depuración y produce un APK
          # que no puede instalarse sobre el oficial: mejor fallar aquí.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Dependencias y pruebas
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Compilar el APK de release
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Renombrar el artefacto
        working-directory: flutter_app
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/uts-nexus-academico-${{ github.ref_name }}.apk"

      - name: Adjuntar el APK al release
        uses: softprops/action-gh-release@v2
        with:
          # El mismo release que acaba de crear el trabajo de escritorio, en el
          # repositorio público de instaladores.
          repository: ${{ env.REPO_RELEASES_OWNER }}/${{ env.REPO_RELEASES_NAME }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: flutter_app/build/app/outputs/flutter-apk/uts-nexus-academico-${{ github.ref_name }}.apk

      # El APK también al espejo: el móvil de la 2.3.3 y anteriores lista los
      # assets por la API de este repositorio y busca el que termina en `.apk`.
      # Sin él encuentra la publicación pero no qué descargar.
      - name: Adjuntar el APK al espejo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flutter_app/build/app/outputs/flutter-apk/uts-nexus-academico-${{ github.ref_name }}.apk

      - name: Guardar el APK para el trabajo de Dropbox
        uses: actions/upload-artifact@v4
        with:
          name: instalador-android
          path: flutter_app/build/app/outputs/flutter-apk/uts-nexus-academico-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 1

      - name: Borrar credenciales del runner
        if: always()
        working-directory: flutter_app/android
        run: rm -f upload-keystore.jks key.properties

  manifiesto:
    name: Manifiesto y espejo
    runs-on: ubuntu-latest
    needs: [desktop, linux, android]
    steps:
      - uses: actions/checkout@v4

      # ── El manifiesto ───────────────────────────────────────────────────
      #
      # Se compone de los assets ya publicados, no de lo que compiló ningún
      # trabajo. Es lo que garantiza que las claves de Windows y las de Linux
      # convivan: quien las escribe ve la release entera, no su propia mitad.
      - name: Componer latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Por variable de entorno y no interpolado dentro del `run`: el cuerpo
          # es texto libre escrito en la anotación de una etiqueta, y una
          # comilla o un acento grave ahí dentro se lo come el shell. Con
          # `${{ }}` en medio del script eso deja de ser una errata y pasa a ser
          # ejecución de lo que ponga la etiqueta.
          NOTAS: ${{ needs.desktop.outputs.cuerpo }}
        run: |
          set -euo pipefail
          gh api "repos/${{ env.REPO_RELEASES_OWNER }}/${{ env.REPO_RELEASES_NAME }}/releases/tags/${{ github.ref_name }}" \
            --jq '.assets | map({name, browser_download_url})' > assets.json

          printf '%s' "$NOTAS" > notas.txt

          node .github/scripts/componer-manifiesto.mjs \
            --version "${{ needs.desktop.outputs.version }}" \
            --assets assets.json \
            --notas-archivo notas.txt \
            --salida latest.json

      - name: Publicar el manifiesto
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.REPO_RELEASES_OWNER }}/${{ env.REPO_RELEASES_NAME }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: latest.json

      # ── Espejo de la publicación en este mismo repositorio ──────────────
      #
      # Las versiones 2.3.3 y anteriores llevan grabada dentro del binario la
      # dirección de ESTE repositorio como servidor de actualizaciones. Cuando
      # era privado, eso era un 404 y esas instalaciones quedaban muertas: no
      # hay forma de cambiarle la dirección a un `.exe` ya instalado.
      #
      # Ahora que es público, publicar aquí el mismo manifiesto las devuelve a
      # la vida. Es el mismo archivo que se acaba de subir al repositorio de
      # instaladores, así que apunta a sus assets y conserva sus firmas: no se
      # firma nada dos veces ni se abre una segunda cadena de confianza.
      #
      # El espejo va **después** del manifiesto y no dentro del trabajo de
      # Windows, que es donde estaba: desde ahí solo veía los paquetes de
      # Windows y publicaría un manifiesto sin Linux.
      #
      # Esto se puede quitar el día que no quede nadie con una versión anterior
      # a la 2.3.4 instalada. Antes no.
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Publicar el espejo aquí
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UTS Nexus Académico ${{ needs.desktop.outputs.nombre }}
          body: ${{ needs.desktop.outputs.cuerpo }}
          files: |
            latest.json
            artefactos/*

  dropbox:
    name: Página de descargas (Dropbox)
    runs-on: ubuntu-latest
    needs: [desktop, linux, android, manifiesto]
    steps:
      - uses: actions/checkout@v4

      # ── Por qué esto es un trabajo aparte y en Linux ────────────────────
      #
      # Aparte, porque la página de descargas es lo ÚLTIMO de la cadena: los
      # instaladores ya están publicados y firmados cuando esto corre, así que
      # un fallo aquí tiene que verse en rojo sin arrastrar a los trabajos que
      # sí terminaron. Dentro del trabajo de escritorio, su fallo saltaba el de
      # Android por la dependencia `needs`.
      #
      # En Linux, porque Git Bash del runner de Windows reescribe los
      # argumentos que empiezan por `/` como rutas de Windows, y la cabecera
      # `Dropbox-API-Arg` lleva dentro la ruta de destino. Ese es el 400 sin
      # mensaje que se comió el release v2.7.0. El script se defiende igual con
      # `MSYS2_ARG_CONV_EXCL`, pero no hay motivo para pedirle a la subida que
      # corra en el entorno donde el problema existe.
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      # ── Orden: Android, Windows y Linux ────────────────────────────────
      #
      # El APK va primero porque es el que más gente descarga y el que más tarda
      # en subir (unos 65 MB frente a 4 del .exe): si algo va a fallar por
      # tamaño o por tiempo de espera, conviene saberlo antes de haber
      # sobrescrito los otros dos. Linux va al final por lo mismo al revés — la
      # AppImage son 79 MB y es el archivo más nuevo de los tres, así que es el
      # que menos gente echaría de menos si un día hubiera que reintentar.
      - name: Sobrescribir el APK
        id: android
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(find artefactos -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No llegó ningún .apk desde el trabajo de Android."
            exit 1
          fi
          bash .github/scripts/subir-a-dropbox.sh "$apk" "$DROPBOX_RUTA_ANDROID"

      - name: Sobrescribir el instalador de Windows
        id: windows
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          # Se busca por el sufijo: el nombre lleva la versión, y cambiarla no
          # debe obligar a tocar el workflow.
          instalador=$(find artefactos -name '*-setup.exe' -print -quit)
          if [ -z "$instalador" ]; then
            echo "::error::No llegó ningún -setup.exe desde el trabajo de escritorio."
            exit 1
          fi
          bash .github/scripts/subir-a-dropbox.sh "$instalador" "$DROPBOX_RUTA_WINDOWS"

      # La AppImage, no el .deb ni el .rpm: un botón de una página no puede
      # preguntar qué distribución usa quien lo pulsa, y la AppImage es la única
      # de las tres que corre en todas. Quien prefiera el paquete nativo lo
      # encuentra en la publicación de GitHub, donde sí puede elegir.
      - name: Sobrescribir la AppImage de Linux
        id: linux
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          appimage=$(find artefactos -name '*.AppImage' -print -quit)
          if [ -z "$appimage" ]; then
            echo "::error::No llegó ninguna .AppImage desde el trabajo de Linux."
            exit 1
          fi
          bash .github/scripts/subir-a-dropbox.sh "$appimage" "$DROPBOX_RUTA_LINUX"

      # Los enlaces son públicos —están escritos en el HTML de la página—, así
      # que dejarlos en el resumen no filtra nada y ahorra tener que buscarlos
      # el día que haya que cambiar el botón.
      - name: Enlaces de la página
        run: |
          {
            echo '### Archivos de la página de descargas'
            echo ''
            echo "- Android: ${{ steps.android.outputs.url }}"
            echo "- Windows: ${{ steps.windows.outputs.url }}"
            echo "- Linux:   ${{ steps.linux.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
