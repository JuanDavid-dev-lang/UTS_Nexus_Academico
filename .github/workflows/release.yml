# Publishes a release that both clients can update themselves from.
#
# The desktop job runs first because `tauri-action` is what creates the GitHub
# Release and the signed `latest.json` manifest that the Tauri updater reads.
# The Android job then attaches its APK to that same release, which is where the
# mobile client looks for it.
#
# The release does NOT live in this repository. This one is private; the one
# named below is public and holds nothing but the installers. An updater has to
# reach its manifest without credentials, and a token shipped inside a `.exe` or
# an `.apk` is not a secret — anyone who installs the app can read it out of the
# binary. Splitting them is what lets the source stay private while the
# installers stay downloadable, which is what an installer is for.
#
# Required repository secrets:
#   RELEASES_TOKEN                      write access to the releases repository
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key (updater signature)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if generated without one)
#   ANDROID_KEYSTORE_BASE64             upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD           store password
#   ANDROID_KEY_ALIAS                   key alias
#   ANDROID_KEY_PASSWORD                key password
#   DROPBOX_APP_KEY                     app de Dropbox (developers.dropbox.com)
#   DROPBOX_APP_SECRET                  su secreto
#   DROPBOX_REFRESH_TOKEN               token de refresco de la cuenta dueña
#
# Los dos instaladores se suben además a Dropbox, encima de los archivos a los
# que apuntan los botones de la página de descargas. La página no consulta el
# release: si esa subida falla, la página sigue repartiendo la versión anterior.
#
# Before tagging, bump BOTH versions so the clients see a newer release:
#   desktop/src-tauri/tauri.conf.json  ->  "version"
#   flutter_app/pubspec.yaml           ->  "version"

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Repositorio público de instaladores. Los clientes consultan su `latest.json`
  # y sus assets; nunca este. Si cambia, hay que cambiarlo también en
  # `desktop/src-tauri/tauri.conf.json` y en
  # `flutter_app/lib/core/services/update_service.dart`.
  REPO_RELEASES_OWNER: JuanDavid-dev-lang
  REPO_RELEASES_NAME: UTS_Nexus_Releases

  # Los mismos dos enlaces que llevan escritos los botones de la página de
  # descargas. Cada trabajo escribe su instalador ENCIMA del archivo al que
  # apunta el suyo, así que la página reparte la versión nueva sin tocar una
  # línea de HTML. Si alguna vez cambian, hay que cambiarlos también en
  # `index.html` del repositorio `utsnexus.github.io`: son enlaces públicos, no
  # secretos, y por eso están a la vista.
  # Sin el parámetro `st=` que copia Dropbox al compartir: es un testigo temporal
  # y caduca. `rlkey` es el que da acceso y no caduca.
  # La app de Dropbox usa acceso "App folder". Estas rutas raíz se guardan
  # físicamente dentro de Dropbox/Apps/UTSNEXUS/.
  DROPBOX_RUTA_WINDOWS: '/UTS-Nexus-Academico-Windows.exe'
  DROPBOX_RUTA_ANDROID: '/UTS-Nexus-Academico-Android.apk'

jobs:
  desktop:
    name: Escritorio (Windows)
    runs-on: windows-latest
    steps:
      # Historia completa: el cuerpo de la release sale de la anotación de la
      # etiqueta, y con un checkout superficial esa anotación no se descarga.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # En el repositorio de instaladores la etiqueta la crea la API y nace sin
      # mensaje, así que hay que llevárselo desde aquí. Sin esto la release sale
      # con el cuerpo vacío y no cuenta nada de lo que trae.
      - name: Leer el mensaje de la etiqueta
        id: etiqueta
        shell: bash
        run: |
          {
            echo 'cuerpo<<FIN_DEL_MENSAJE'
            git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}"
            echo 'FIN_DEL_MENSAJE'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Instalar dependencias
        working-directory: desktop
        run: npm ci

      - name: Verificar antes de publicar
        working-directory: desktop
        run: |
          npm run typecheck
          npm test

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          # El token del propio repositorio no sirve: la release se crea en otro.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          owner: ${{ env.REPO_RELEASES_OWNER }}
          repo: ${{ env.REPO_RELEASES_NAME }}
          tagName: ${{ github.ref_name }}
          # La etapa va en el nombre a propósito: quien abre la página de
          # publicaciones tiene que saber que instala algo en construcción sin
          # tener que deducirlo del número. Al pasar a beta o a estable hay que
          # cambiarla aquí y en los dos archivos `version` de los clientes.
          releaseName: UTS Nexus Académico Alfa ${{ github.ref_name }}
          releaseBody: ${{ steps.etiqueta.outputs.cuerpo }}
          # El commit de este repositorio no existe en el de instaladores, así
          # que la etiqueta tiene que nacer de su rama principal.
          releaseCommitish: main
          releaseDraft: false
          prerelease: false
          # Genera y sube `latest.json`, el manifiesto que consulta el updater.
          includeUpdaterJson: true

      # ── Espejo de la publicación en este mismo repositorio ─────────────────
      #
      # Las versiones 2.3.3 y anteriores llevan grabada dentro del binario la
      # dirección de ESTE repositorio como servidor de actualizaciones. Cuando
      # era privado, eso era un 404 y esas instalaciones quedaban muertas: no
      # hay forma de cambiarle la dirección a un `.exe` ya instalado.
      #
      # Ahora que es público, publicar aquí el mismo manifiesto las devuelve a
      # la vida. El `latest.json` se copia tal cual del repositorio de
      # instaladores, así que apunta a sus assets y conserva su firma: no se
      # firma nada dos veces ni se abre una segunda cadena de confianza.
      #
      # Esto se puede quitar el día que no quede nadie con una versión anterior
      # a la 2.3.4 instalada. Antes no.
      - name: Traer el manifiesto recién publicado
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o latest.json \
            "https://github.com/${{ env.REPO_RELEASES_OWNER }}/${{ env.REPO_RELEASES_NAME }}/releases/download/${{ github.ref_name }}/latest.json"

      - name: Publicar el espejo aquí
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UTS Nexus Académico Alfa ${{ github.ref_name }}
          body: ${{ steps.etiqueta.outputs.cuerpo }}
          files: |
            latest.json
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.sig

      # El instalador se guarda como artefacto para el trabajo de Dropbox, que
      # corre aparte. Antes la subida a Dropbox era un paso de ESTE trabajo, y
      # eso tenía una consecuencia que costó un release entero: `android`
      # declara `needs: desktop`, así que un fallo al subir a Dropbox —cuando
      # el `.exe` ya estaba publicado y firmado— dejaba el trabajo en rojo y
      # Android **ni se ejecutaba**. La publicación se quedaba sin APK por un
      # problema que no tenía nada que ver con Android.
      - name: Guardar el instalador para el trabajo de Dropbox
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  android:
    name: Móvil (Android)
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar el keystore de firma
        working-directory: flutter_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Sin keystore el build cae a la clave de depuración y produce un APK
          # que no puede instalarse sobre el oficial: mejor fallar aquí.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Dependencias y pruebas
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Compilar el APK de release
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Renombrar el artefacto
        working-directory: flutter_app
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/uts-nexus-academico-${{ github.ref_name }}.apk"

      - name: Adjuntar el APK al release
        uses: softprops/action-gh-release@v2
        with:
          # El mismo release que acaba de crear el trabajo de escritorio, en el
          # repositorio público de instaladores.
          repository: ${{ env.REPO_RELEASES_OWNER }}/${{ env.REPO_RELEASES_NAME }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: flutter_app/build/app/outputs/flutter-apk/uts-nexus-academico-${{ github.ref_name }}.apk

      # El APK también al espejo: el móvil de la 2.3.3 y anteriores lista los
      # assets por la API de este repositorio y busca el que termina en `.apk`.
      # Sin él encuentra la publicación pero no qué descargar.
      - name: Adjuntar el APK al espejo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flutter_app/build/app/outputs/flutter-apk/uts-nexus-academico-${{ github.ref_name }}.apk

      - name: Guardar el APK para el trabajo de Dropbox
        uses: actions/upload-artifact@v4
        with:
          name: instalador-android
          path: flutter_app/build/app/outputs/flutter-apk/uts-nexus-academico-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 1

      - name: Borrar credenciales del runner
        if: always()
        working-directory: flutter_app/android
        run: rm -f upload-keystore.jks key.properties

  dropbox:
    name: Página de descargas (Dropbox)
    runs-on: ubuntu-latest
    needs: [desktop, android]
    steps:
      - uses: actions/checkout@v4

      # ── Por qué esto es un trabajo aparte y en Linux ────────────────────
      #
      # Aparte, porque la página de descargas es lo ÚLTIMO de la cadena: los
      # instaladores ya están publicados y firmados cuando esto corre, así que
      # un fallo aquí tiene que verse en rojo sin arrastrar a los trabajos que
      # sí terminaron. Dentro del trabajo de escritorio, su fallo saltaba el de
      # Android por la dependencia `needs`.
      #
      # En Linux, porque Git Bash del runner de Windows reescribe los
      # argumentos que empiezan por `/` como rutas de Windows, y la cabecera
      # `Dropbox-API-Arg` lleva dentro la ruta de destino. Ese es el 400 sin
      # mensaje que se comió el release v2.7.0. El script se defiende igual con
      # `MSYS2_ARG_CONV_EXCL`, pero no hay motivo para pedirle a la subida que
      # corra en el entorno donde el problema existe.
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Sobrescribir el instalador de Windows
        id: windows
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          # Se busca por el sufijo: el nombre lleva la versión, y cambiarla no
          # debe obligar a tocar el workflow.
          instalador=$(find artefactos -name '*-setup.exe' -print -quit)
          if [ -z "$instalador" ]; then
            echo "::error::No llegó ningún -setup.exe desde el trabajo de escritorio."
            exit 1
          fi
          bash .github/scripts/subir-a-dropbox.sh "$instalador" "$DROPBOX_RUTA_WINDOWS"

      - name: Sobrescribir el APK
        id: android
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(find artefactos -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No llegó ningún .apk desde el trabajo de Android."
            exit 1
          fi
          bash .github/scripts/subir-a-dropbox.sh "$apk" "$DROPBOX_RUTA_ANDROID"

      # Los enlaces son públicos —están escritos en el HTML de la página—, así
      # que dejarlos en el resumen no filtra nada y ahorra tener que buscarlos
      # el día que haya que cambiar el botón.
      - name: Enlaces de la página
        run: |
          {
            echo '### Archivos de la página de descargas'
            echo ''
            echo "- Windows: ${{ steps.windows.outputs.url }}"
            echo "- Android: ${{ steps.android.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
